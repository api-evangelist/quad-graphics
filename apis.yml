name: Quad/Graphics
description: >-
  Quad (NYSE: QUAD), formerly Quad/Graphics, is a Sussex, Wisconsin marketing experience
  company that pairs one of North America's largest commercial printing platforms with
  data, creative, media and marketing-technology services. Its offer spans audience
  targeting and consumer analytics, creative and content production through its Betty
  agency, omnichannel media planning and placement through its Rise agency, catalog,
  magazine, direct mail and packaging production, in-store retail media displays, postal
  optimization and logistics, and the QuadMed employee health business. Quad markets three
  named marketing-technology platforms — At-Home Connect for automated triggered direct
  mail, Local Connect for multi-location marketing, and In-Store Connect for retail media —
  and advertises API integration with CRM and marketing-automation platforms for At-Home
  Connect, but publishes no developer portal, API reference or machine-readable
  specification for any of them.
